name: monitor

on:
  push:
    branches: [main]
    paths: ["monitor/**", ".github/workflows/monitor.yml"]
  pull_request:
    paths: ["monitor/**", ".github/workflows/monitor.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: monitor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Synthetic data only: no network, no AWS credentials.
      - run: python -m pytest -q
      - run: cfn-lint infra/ec2.yaml

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x -P deploy deploy/*.sh app/entrypoint.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t hiring-monitor-web app

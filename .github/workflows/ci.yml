name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            monitor/requirements-dev.txt
            analysis/requirements.txt
      - run: pip install -r monitor/requirements-dev.txt -r analysis/requirements.txt -e .
      # Synthetic data only: no network, no AWS credentials.
      - run: python -m pytest -q ablab analysis
      - run: python -m pytest -q
        working-directory: monitor
      - run: cfn-lint infra/ec2.yaml

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x deploy/*.sh monitor/app/entrypoint.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-context ablab=ablab -t ab-lab-monitor monitor/app

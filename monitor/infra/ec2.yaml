AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Hiring Demand Monitor on EC2: an Ubuntu 24.04 (arm64) instance with an Elastic IP,
  running the Dash app (gunicorn) behind Caddy (automatic Let's Encrypt HTTPS) via
  Docker Compose, with a daily data refresh.

Parameters:
  ProjectName:
    Type: String
    Default: hiring-monitor
    AllowedPattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
    Description: Lowercase name used for resources, the app directory and systemd units.

  DomainName:
    Type: String
    AllowedPattern: "^[a-z0-9.-]+\\.[a-z]{2,}$"
    Description: >-
      Hostname Caddy requests a certificate for, e.g. hiring.example.com. Its DNS A
      record must point at this stack's Elastic IP before the certificate is issued.

  AdminEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    Description: Contact address Let's Encrypt uses for expiry notices.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair (create it with deploy/01_keypair.sh).

  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
    Description: >-
      Graviton (arm64). t4g.micro = 1 GB (fits one app worker), t4g.small = 2 GB
      (headroom for 2 workers and image builds).

  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Latest Canonical Ubuntu 24.04 arm64 AMI, resolved from AWS's public SSM parameter.

  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 12
    MaxValue: 100
    Description: Root volume in GiB (gp3, encrypted).

  SshCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: >-
      Restrict SSH to your own address, e.g. 203.0.113.9/32
      (find it with: curl -s https://checkip.amazonaws.com).

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName}: SSH from admin, HTTP/HTTPS from anywhere"
      SecurityGroupIngress:
        - Description: SSH (admin only)
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
        - Description: HTTP (Caddy redirects to HTTPS; needed for the ACME challenge)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTPS
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP/3
          IpProtocol: udp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: project
          Value: !Ref ProjectName

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required          # IMDSv2 only
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: !Ref ProjectName
        - Key: project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/bootstrap.log) 2>&1

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg rsync

          # Swap keeps a 1 GB instance alive through an image build.
          if [ ! -f /swapfile ]; then
            fallocate -l 1G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # Docker Engine + Compose v2 from Docker's own apt repository.
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" \
            > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker
          usermod -aG docker ubuntu

          APP_DIR=/opt/${ProjectName}
          mkdir -p "${!APP_DIR}"

          cat > "${!APP_DIR}/Caddyfile" <<CADDY
          {
              email ${AdminEmail}
          }

          ${DomainName} {
              encode zstd gzip
              reverse_proxy web:8050
          }
          CADDY
          chown -R ubuntu:ubuntu "${!APP_DIR}"

          # The app: compose up on boot.
          cat > /etc/systemd/system/${ProjectName}.service <<UNIT
          [Unit]
          Description=${ProjectName} (Dash + Caddy via Docker Compose)
          Requires=docker.service
          After=docker.service network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/${ProjectName}
          ExecStart=/usr/bin/docker compose up -d --build
          ExecStop=/usr/bin/docker compose down
          TimeoutStartSec=900

          [Install]
          WantedBy=multi-user.target
          UNIT

          # Daily data refresh: Hiring Lab publishes weekly; the Freshness check turns the
          # dashboard badge red if this ever stops working.
          cat > /etc/systemd/system/${ProjectName}-refresh.service <<UNIT
          [Unit]
          Description=${ProjectName}: refresh Indeed Hiring Lab data and restart the app
          Requires=${ProjectName}.service
          After=${ProjectName}.service

          [Service]
          Type=oneshot
          WorkingDirectory=/opt/${ProjectName}
          ExecStart=/usr/bin/docker compose exec -T web python build_hiringlab.py --refresh
          ExecStartPost=/usr/bin/docker compose restart web
          UNIT

          cat > /etc/systemd/system/${ProjectName}-refresh.timer <<UNIT
          [Unit]
          Description=${ProjectName}: daily data refresh

          [Timer]
          OnCalendar=*-*-* 13:00:00 UTC
          Persistent=true
          RandomizedDelaySec=900

          [Install]
          WantedBy=timers.target
          UNIT

          systemctl daemon-reload
          systemctl enable ${ProjectName}.service
          systemctl enable --now ${ProjectName}-refresh.timer

          touch /var/lib/bootstrap-complete

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - Key: project
          Value: !Ref ProjectName

Outputs:
  PublicIpAddress:
    Description: Point your domain's A record at this address.
    Value: !GetAtt ElasticIp.PublicIp

  DnsRecord:
    Description: The A record to create in your DNS zone.
    Value: !Sub "${DomainName}  A  ${ElasticIp.PublicIp}  (TTL 300)"

  SshCommand:
    Value: !Sub "ssh -i ~/.ssh/${KeyPairName} ubuntu@${ElasticIp.PublicIp}"

  SiteUrl:
    Value: !Sub "https://${DomainName}"

services:
  web:
    build:
      context: ./app
      # The ablab package lives at the repo root (../ablab); deploy/03 ships it to
      # ./ablab on the host and sets ABLAB_DIR there.
      additional_contexts:
        ablab: ${ABLAB_DIR:-../ablab}
    image: hiring-monitor-web
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      WEB_WORKERS: ${WEB_WORKERS:-1}
      # Experiment: off unless AB_EXPERIMENT is set (then AB_SALT is required and
      # must never change mid-experiment). See ../docs/experiment_design.md.
      AB_EXPERIMENT: ${AB_EXPERIMENT:-}
      AB_SALT: ${AB_SALT:-}
      AB_SPLIT: ${AB_SPLIT:-50}
      AB_DB_PATH: /data/events.db
    volumes:
      - hm_data:/data
    expose:
      - "8050"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8050/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # first start downloads ~12 MB and builds the database

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  hm_data:
  caddy_data:
  caddy_config:

services:
  web:
    build:
      context: ./monitor/app
      additional_contexts:
        ablab: ./ablab        # the experiment package, copied into the image
    image: ab-lab-monitor
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      WEB_WORKERS: ${WEB_WORKERS:-1}
      AB_EXPERIMENT: ${AB_EXPERIMENT:-}
      AB_SALT: ${AB_SALT:-}
      AB_SPLIT: ${AB_SPLIT:-50}
      AB_DB_PATH: /data/events.db
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    volumes:
      # Hiring Lab data (hiringlab.db) and the experiment's events.db: the
      # deployment's only durable state.
      - data:/data
    expose:
      - "8050"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8050/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # first start downloads the Hiring Lab data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      AB_DOMAIN: ${AB_DOMAIN:?AB_DOMAIN must be set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
